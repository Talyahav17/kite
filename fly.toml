# Fly.io configuration for Kite.
#
# Two things here are load-bearing:
#
#   1. The [mounts] volume. Kite stores everything in a SQLite file, and a
#      container's own filesystem is destroyed on every deploy — without this
#      volume, every trip disappears the next time you ship.
#
#   2. The machine stays on. It used to sleep when idle, which was cheaper but
#      meant the first visitor after a quiet spell waited on a blank page while
#      it woke up — and Kite's backups run on a timer inside the process, so a
#      sleeping machine also stopped backing up. Always-on costs a few dollars
#      a month and fixes both.
#
# A single machine is correct for now. SQLite is one writer, and the rate
# limiter counts in memory per process — a second machine would split both.

app = "kite-talyahav"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  KITE_DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "kite_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
