name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite and the built-in test runner both need a recent Node
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          npm install --prefix server
          npm install --prefix client

      - name: Test the API
        run: npm test

      - name: Check the client builds
        run: npm run build --prefix client
