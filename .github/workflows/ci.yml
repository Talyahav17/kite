name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite and the built-in test runner both need a recent Node
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          npm install --prefix server
          npm install --prefix client

      # P-053: one rule, guarding the mistake that reached main three times
      - name: Lint for unhandled promises
        run: |
          npm install
          npm run lint

      - name: Test the API
        run: npm test

      - name: Check the client builds
        run: npm run build --prefix client

  # P-050: the flows a browser has to actually walk — signing in, naming a
  # trip, accepting a day plan, opening a share link while signed out. Split
  # from the unit job so a browser download never delays that feedback.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          npm install
          npm install --prefix server
          npm install --prefix client

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # A failure here is worth looking at rather than guessing about: the
      # trace replays the run step by step.
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
