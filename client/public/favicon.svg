<!-- The sail alone, cropped from the logo artwork — a full lockup is illegible
     at 16px. Geometry and colours match KiteLogo.jsx exactly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="128 52 96 140">
  <defs>
    <linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B00E8"/><stop offset="60%" stop-color="#7500C0"/><stop offset="100%" stop-color="#550099"/>
    </linearGradient>
    <linearGradient id="f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B833FF"/><stop offset="100%" stop-color="#8000D4"/>
    </linearGradient>
  </defs>
  <path d="M 180,60 L 135,115 L 180,185 L 180,60 Z" fill="url(#f)"/>
  <path d="M 180,60 L 225,115 L 180,185 L 180,60 Z" fill="url(#p)"/>
  <path d="M 180,60 L 180,185" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 135,115 L 225,115" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
</svg>
